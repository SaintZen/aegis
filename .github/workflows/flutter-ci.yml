name: Flutter CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    # Push events carry a write token that can publish the sideload
    # GitHub Release. Phone Link cannot carry the 119MB APK.
    branches: [ main, master, 'cursor/**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable # keep this if you want the stable channel
          flutter-version: '3.38.4' # pin to match pubspec.lock (Dart >=3.10.3)
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Static analysis
        # Fail only on errors; the codebase carries many pre-existing
        # info/warning lints (e.g. withOpacity/Share deprecations).
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  # Sideload APK for the operator. Cursor cannot preview the ~119MB
  # arm64 build, and Phone Link drops files this size / blocks .apk.
  # GitHub Releases is the phone-download path.
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: aegis-2026-09-19-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Name the phone-download APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Aegis-arm64-sideload.apk

      # Phone Link cannot carry this file. The phone downloads it here.
      # Push events (not pull_request) have a token that can write the tag.
      - name: Publish sideload GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aegis-sideload
          name: Aegis sideload (phone download)
          prerelease: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/Aegis-arm64-sideload.apk
          body: |
            Arm64 APK for operator sideload (~119MB).

            Download this on the phone. Do not send it through Phone Link —
            Phone Link fails on a file this size and often blocks .apk.

            On the phone:
            1. Stay logged into GitHub
            2. Tap Aegis-arm64-sideload.apk
            3. Allow the browser to install unknown apps if Android asks
            4. If Android refuses an update, uninstall the old Aegis / Anxiety Anchor first, then install this APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
