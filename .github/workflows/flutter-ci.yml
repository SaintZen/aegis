name: Flutter CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable # keep this if you want the stable channel
          flutter-version: '3.38.4' # matches pubspec.lock (Dart >= 3.10.3)
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Static analysis
        # Errors fail the job. Pre-existing infos (withOpacity deprecations)
        # and warnings are triaged in docs/ANALYZER_TRIAGE.md and must not
        # block CI until that backlog is cleared.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
